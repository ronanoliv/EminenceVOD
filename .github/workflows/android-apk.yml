name: Build Eminence VOD APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Check preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Compile, lint and package APKs
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Verify debug APK
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$tools/apksigner" verify "$apk"
          "$tools/aapt" dump badging "$apk" | grep 'leanback-launchable-activity:'
      - uses: actions/upload-artifact@v4
        with:
          name: EminenceVOD-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
